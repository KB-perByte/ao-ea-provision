---
# Assert script nodes are effective on the worker — or fail with a short,
# actionable message. Never patches the worker Deployment (operator SSA).

- name: Mark script nodes effective when the worker already has them
  ansible.builtin.set_fact:
    script_nodes_effective: true
  when: worker_script_nodes_enabled | bool

- name: Explain success
  ansible.builtin.debug:
    msg: >-
      Script nodes OK: {{ script_nodes_env_name }}=true on
      {{ ao_worker_deploy_name }} in {{ app_ns }} (Execution Plane enabled).
  when: script_nodes_effective | default(false) | bool

- name: Fail gracefully when Execution Plane prerequisites are missing
  ansible.builtin.fail:
    msg: |
      Script nodes cannot be enabled on {{ app_ns }}/{{ ao_name }}.

      Why: the operator only sets {{ script_nodes_env_name }}=true when
      Execution Plane is enabled. Prerequisites are missing:
        - EP database Secret {{ ao_ep_db_secret_name }}: {{ 'present' if (ep_db_secret_present | bool) else 'MISSING' }}
        - Secret keys database/username/password: {{ 'ok' if (ep_db_secret_keys_ok | bool) else 'incomplete/missing' }}
        - ENABLE_EXECUTION_PLANE on {{ ao_admin_settings_name }}: {{ 'true' if (ep_enabled | bool) else 'false' }}
        - Worker {{ ao_worker_deploy_name }} env: {{ worker_script_nodes_value | default('(unset)') }}

      What to do:
        1) Stock weekly / no EP yet — skip this step:
             ansible-playbook playbooks/postconfig.yml \
               -e @secrets/local.extra_vars.yml \
               -e script_nodes_enabled=false
           (or set script_nodes_enabled: false in local.extra_vars.yml)
        2) To enable script nodes — create the EP database on BYO Postgres,
           create Secret {{ ao_ep_db_secret_name }} in {{ app_ns }}, then
           re-run ea-postconfig.

      Note: this playbook will not patch the worker Deployment; the
      operator would overwrite it via Server-Side Apply.
  when:
    - not (script_nodes_effective | default(false) | bool)
    - not (ep_db_secret_present | bool) or not (ep_db_secret_keys_ok | bool)

- name: Fail gracefully when EP was requested but worker env never flipped
  ansible.builtin.fail:
    msg: |
      Script nodes still not effective on {{ app_ns }}/{{ ao_worker_deploy_name }}.

      Execution Plane prerequisites looked OK, but
      {{ script_nodes_env_name }} is still {{ worker_script_nodes_value | default('(unset)') }}
      after waiting for the operator.

      Check: operator logs, ConfigMap {{ ao_admin_settings_name }},
      and that Secret {{ ao_ep_db_secret_name }} is valid. Or skip with
      -e script_nodes_enabled=false.
  when:
    - not (script_nodes_effective | default(false) | bool)
    - ep_db_secret_present | bool
    - ep_db_secret_keys_ok | bool

- name: Show postconfig result
  ansible.builtin.debug:
    msg:
      script_nodes_effective: "{{ script_nodes_effective }}"
      script_nodes_enabled: "{{ script_nodes_enabled }}"
      worker_script_nodes_enabled: "{{ worker_script_nodes_enabled }}"
      ep_enabled: "{{ ep_enabled }}"
      ao_name: "{{ ao_name }}"
      app_ns: "{{ app_ns }}"
  when: script_nodes_effective | default(false) | bool
