---
# Assert script nodes are effective on the worker. Callers set
# worker_script_nodes_enabled (from k8s_info or a local mock).
# Never patches the worker Deployment; operator SSA would revert it.

- name: Require APP_SCRIPT_NODES_ENABLED on the worker
  ansible.builtin.assert:
    that:
      - worker_script_nodes_enabled | bool
    fail_msg: >-
      {{ script_nodes_env_name }} is not true on Deployment
      {{ ao_worker_deploy_name }} in {{ app_ns }}
      (value={{ worker_script_nodes_value | default('') }},
      worker_exists={{ worker_exists | default(false) }},
      ep_enabled={{ ep_enabled | default(false) }},
      cr_has_ep_field={{ cr_has_ep_field | default(false) }},
      ep_db_secret_present={{ ep_db_secret_present | default(false) }},
      ep_db_secret_keys_ok={{ ep_db_secret_keys_ok | default(false) }}).
      The operator sets {{ script_nodes_env_name }}=true on the worker
      only when Execution Plane is enabled. AutomationOrchestrator has
      no public executionPlane or scriptNodes CR field. Reconciler-safe
      path: ConfigMap {{ ao_admin_settings_name }} with
      {{ ep_enable_key }}=true AND Secret {{ ao_ep_db_secret_name }}
      (keys database, username, password) plus an Execution Plane
      database on the BYO PostgreSQL. Do not patch the worker
      Deployment env; operator Server-Side Apply will overwrite it.
      This playbook will not apply a doomed Deployment env patch.
      Create the EP database and Secret (not part of ea-ensure-db /
      ea-ensure-secrets today), then re-run ea-postconfig.
    success_msg: >-
      {{ script_nodes_env_name }}=true on {{ ao_worker_deploy_name }}
      (operator-managed; Execution Plane enabled).

- name: Mark script nodes effective
  ansible.builtin.set_fact:
    script_nodes_effective: true

- name: Show postconfig result
  ansible.builtin.debug:
    msg:
      script_nodes_effective: "{{ script_nodes_effective }}"
      script_nodes_enabled: "{{ script_nodes_enabled }}"
      worker_script_nodes_enabled: "{{ worker_script_nodes_enabled }}"
      ep_enabled: "{{ ep_enabled }}"
      cr_has_ep_field: "{{ cr_has_ep_field }}"
      ao_name: "{{ ao_name }}"
      app_ns: "{{ app_ns }}"
      ao_worker_deploy_name: "{{ ao_worker_deploy_name }}"
