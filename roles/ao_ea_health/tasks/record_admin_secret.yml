---
# Record Secret presence and key names only. Callers set
# admin_password_query (k8s_info with no_log, or a local mock of keys
# only). Never print Secret data values.

- name: Reset admin password Secret presence
  ansible.builtin.set_fact:
    admin_password_secret_present: false
    admin_password_secret_keys: []

- name: Record initial-admin-password Secret presence without values
  ansible.builtin.set_fact:
    admin_password_secret_present: "{{ (admin_password_query.resources | default([])) | length > 0 }}"
    admin_password_secret_keys: "{{ ((admin_password_query.resources[0].data | default({})).keys() | list) if ((admin_password_query.resources | default([])) | length > 0) else [] }}"
