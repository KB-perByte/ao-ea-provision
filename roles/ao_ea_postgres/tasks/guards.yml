---
# Cluster-free: require identifiers and AAP-injected passwords.
# Initializes pg_host / pvc_bound / db_ready fail-closed. Does not call k8s.

- name: Require postgres ensure identifiers
  ansible.builtin.assert:
    that:
      - db_ns is defined and (db_ns | length) > 0
      - pg_service_name is defined and (pg_service_name | length) > 0
      - pg_pvc_name is defined and (pg_pvc_name | length) > 0
      - pg_image is defined and (pg_image | length) > 0
      - pg_pvc_size is defined and (pg_pvc_size | length) > 0
      - pg_storage_class is defined and (pg_storage_class | length) > 0
    fail_msg: >-
      ensure_db requires db_ns, pg_service_name, pg_pvc_name, pg_image,
      pg_pvc_size, and pg_storage_class to be defined and non-empty.

- name: Require PVC name to match volumeClaimTemplates
  ansible.builtin.assert:
    that:
      - pg_pvc_name == 'data-' ~ pg_service_name ~ '-0'
    fail_msg: >-
      pg_pvc_name {{ pg_pvc_name }} must be data-{{ pg_service_name }}-0
      (volumeClaimTemplates name data, replica 0). Refusing a mismatch
      that would create a second PVC.

- name: Resolve postgres passwords from pg_* or vault_pg_*
  ansible.builtin.set_fact:
    pg_admin_password: "{{ pg_admin_password | default(vault_pg_admin_password | default(''), true) }}"
    pg_orchestrator_password: "{{ pg_orchestrator_password | default(vault_pg_orchestrator_password | default(''), true) }}"
    pg_temporal_password: "{{ pg_temporal_password | default(vault_pg_temporal_password | default(''), true) }}"
    pg_execution_plane_password: "{{ pg_execution_plane_password | default(vault_pg_execution_plane_password | default(''), true) }}"
  no_log: true

- name: Require postgres passwords from AAP credentials or local extra-vars
  ansible.builtin.assert:
    that:
      - pg_admin_password is defined and (pg_admin_password | length) > 0
      - pg_orchestrator_password is defined and (pg_orchestrator_password | length) > 0
      - pg_temporal_password is defined and (pg_temporal_password | length) > 0
    fail_msg: >-
      ensure_db requires non-empty pg_admin_password, pg_orchestrator_password,
      and pg_temporal_password (or vault_pg_* aliases). The file
      secrets/local.extra_vars.yml is gitignored and is NOT loaded automatically —
      pass it explicitly:
        ansible-playbook playbooks/ensure_db.yml -e @secrets/local.extra_vars.yml
      On AAP, inject the same vars from Controller credentials. Do not hardcode
      passwords in the repo. (Wrong: -e secrets/local.extra_vars.yml without @)
    success_msg: Postgres passwords are present (values not shown).

- name: Require Execution Plane password when script nodes are enabled
  ansible.builtin.assert:
    that:
      - pg_execution_plane_password is defined and (pg_execution_plane_password | length) > 0
      - pg_execution_plane_user is defined and (pg_execution_plane_user | length) > 0
      - pg_execution_plane_database is defined and (pg_execution_plane_database | length) > 0
    fail_msg: >-
      script_nodes_enabled=true requires non-empty
      pg_execution_plane_password (or vault_pg_execution_plane_password),
      plus pg_execution_plane_user / pg_execution_plane_database.
      ensure_db creates that role and database on BYO Postgres so
      ensure_secrets / postconfig can enable Execution Plane.
      Skip with -e script_nodes_enabled=false if EP is not needed.
    success_msg: Execution Plane DB password is present (value not shown).
  when: script_nodes_enabled | default(true) | bool

- name: Initialize postgres facts fail-closed
  ansible.builtin.set_fact:
    pg_host: "{{ pg_service_name }}.{{ db_ns }}.svc"
    pg_pod_name: "{{ pg_service_name }}-0"
    pvc_bound: false
    db_ready: false
