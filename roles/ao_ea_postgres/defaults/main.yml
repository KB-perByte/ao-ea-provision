---
# Image/size match the dogfood runbook (quay SCLORG PG 15, gp3-csi 20Gi).
# Inventory group_vars may override. Passwords come from AAP extra_vars /
# credentials (pg_* or vault_pg_*). Never store real passwords in this repo.

pg_image: quay.io/sclorg/postgresql-15-c9s:latest
pg_pvc_size: 20Gi
pg_storage_class: gp3-csi
pg_max_connections: 200
pg_port: 5432
pg_secret_name: ao-postgres-credentials
pg_orchestrator_user: orchestrator
pg_orchestrator_database: orchestrator
# Execution Plane (script nodes). Created when script_nodes_enabled=true.
pg_execution_plane_user: execution_plane
pg_execution_plane_database: execution_plane
script_nodes_enabled: true
# Recreate execution_plane DB on provision_mode=update so early-access EP
# migrations are not blocked by a prior alembic stamp the new image lacks.
ep_reset_on_update: true
# Force recreate even on clean_install / standalone ensure_db.
ep_force_reset: false
# Known-bad stamps seen when EA EP images diverge (extend as needed).
ep_stale_alembic_revisions:
  - n0k1l2m3n4o5
pg_wait_timeout: 300
pg_wait_delay: 5
pg_container_name: postgres
pg_init_retries: 5
pg_init_delay: 3
k8s_validate_certs: true

# Passwords are NOT defaulted here. Pass via:
#   -e @secrets/local.extra_vars.yml
#   or AAP credentials / -e pg_*_password=… / -e vault_pg_*_password=…
# Guards resolve pg_* from vault_pg_* when needed.
# EP also needs pg_execution_plane_password / vault_pg_execution_plane_password
# when script_nodes_enabled=true.
