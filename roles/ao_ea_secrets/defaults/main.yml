---
# Secret names and keys match the AO CR secretRef schema (database,
# username, password). Passwords come from AAP extra_vars / credentials
# (pg_* or vault_pg_*). Never store real passwords in this repo.
# Users/DBs must match roles created by ea-ensure-db.

orchestrator_pg_secret_name: orchestrator-pg-credentials
temporal_pg_secret_name: temporal-pg-credentials
pg_orchestrator_user: orchestrator
pg_orchestrator_database: orchestrator
pg_temporal_user: temporal
pg_temporal_database: temporal
# Execution Plane Secret (operator default name: {ao_name}-execution-plane-database)
ao_ep_db_secret_suffix: execution-plane-database
ao_ep_db_secret_name: "{{ ao_name }}-{{ ao_ep_db_secret_suffix }}"
pg_execution_plane_user: execution_plane
pg_execution_plane_database: execution_plane
script_nodes_enabled: true
pg_port: 5432
k8s_validate_certs: true

# Optional read-only connect as the secret users. Skip offline / when the
# PostgreSQL pod is not reachable: -e secrets_verify_connect=false
secrets_verify_connect: true
pg_wait_timeout: 300
pg_wait_delay: 5

# Passwords are NOT defaulted here. Pass via -e @secrets/local.extra_vars.yml
# or AAP credentials (pg_* or vault_pg_*). Same values as ea-ensure-db.
# EP also needs pg_execution_plane_password when script_nodes_enabled=true.
