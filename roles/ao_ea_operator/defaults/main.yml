---
# Package name matches OLM Subscription spec.name / PackageManifest.
# Subscription name and operator_ns live in inventory/group_vars/all.yml.
# Default ao_channel is early-access; honor override via extra-vars.

ao_operator_package: automation-orchestrator-operator
k8s_validate_certs: true
ao_subscription_healthy_state: AtLatestKnown
ao_csv_healthy_phase: Succeeded
operator_install_plan_approval: Automatic
# When true, existing Subscriptions are reconciled to ao_channel (and
# installPlanApproval) then waited to AtLatestKnown. Required for
# update_release / channel switches via playbooks.
operator_manage_channel: true
operator_wait_timeout: 900
operator_wait_delay: 15
operator_created: false
operator_channel_reconciled: false
ao_operator_manager_deployment_name: automation-orchestrator-operator-controller-manager

# OLM applies Subscription.spec.config.env to the Operator deployment. These
# values override the Operator's Quay :devel fallbacks before it seeds AO's DB.
ao_script_image_env:
  - name: RELATED_IMAGE_SCRIPT_PYTHON
    value: "{{ ao_script_python_image_reference }}"
  - name: RELATED_IMAGE_SCRIPT_BASH
    value: "{{ ao_script_bash_image_reference }}"
