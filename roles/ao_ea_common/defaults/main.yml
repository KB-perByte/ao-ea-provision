---
# Role-level defaults. Cluster/namespace values live in inventory/group_vars/all.yml.

# Namespace the teardown playbook is allowed to mutate. Must never equal db_ns.
teardown_target_ns: "{{ app_ns }}"

# Namespaces requested for deletion. Must never include db_ns.
teardown_delete_namespaces: []

# PVC names requested for deletion. Must never include pg_pvc_name.
teardown_delete_pvcs: []

# StatefulSet names requested for deletion. Must never include pg_service_name.
teardown_delete_statefulsets: []

# k8s module host comes from cluster_api. Token/kubeconfig come from AAP
# Kubernetes credentials (K8S_AUTH_*) or optional extra-vars k8s_api_key /
# k8s_kubeconfig. Do not store secrets in this repo.
k8s_validate_certs: true

# PackageManifest metadata.name for the AO operator.
ao_operator_package: automation-orchestrator-operator
