---
# PDE AO-05 defaults for weekly early-access AO provision.
# Keep cluster/namespace values here so they can be parameterized later.
# Never store secrets (OCP tokens, PG passwords, admin passwords) in this repo.

cluster_api: "https://api.pde-ao-05.rnil.p3.openshiftapps.com:443"
app_ns: syntarogation-ao-nov
db_ns: syntarogation-ao-nov-db
ao_name: my-orchestrator
pg_service_host: ao-postgres.syntarogation-ao-nov-db.svc
pg_service_name: ao-postgres
route_host: syntarogation-ao-nov.apps.rosa.pde-ao-05.rnil.p3.openshiftapps.com
ao_channel: early-access
catalog_source: redhat-operators
catalog_ns: openshift-marketplace
operator_ns: automation-orchestrator-operator-system
operator_subscription_name: automation-orchestrator-operator
script_nodes_enabled: true
pg_pvc_name: data-ao-postgres-0
pg_image: quay.io/sclorg/postgresql-15-c9s:latest
pg_pvc_size: 20Gi
pg_storage_class: gp3-csi
pg_max_connections: 200
pg_port: 5432
orchestrator_pg_secret_name: orchestrator-pg-credentials
temporal_pg_secret_name: temporal-pg-credentials
pg_orchestrator_user: orchestrator
pg_orchestrator_database: orchestrator
pg_temporal_user: temporal
pg_temporal_database: temporal
