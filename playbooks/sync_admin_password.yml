---
# JT / standalone: sync {ao}-initial-admin-password into the application
# DB after Ready. Covers clean install and teardown+recreate against a
# persistent orchestrator DB (seed only sets the password on first create).
# Never prints the password.
#
#   ansible-playbook playbooks/sync_admin_password.yml \
#     -e @secrets/local.extra_vars.yml
#   ansible-playbook playbooks/sync_admin_password.yml \
#     -e @secrets/local.extra_vars.yml -e admin_password_sync=false

- name: Sync AO admin password from Secret into the DB
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Run AO EA admin password sync
      ansible.builtin.include_role:
        name: ao_ea_admin
