---
# JT ea-ensure-operator.
# Ensure AO Operator Subscription in operator_ns for ao_channel:
# - Clean cluster: create Namespace + OperatorGroup + Subscription.
# - Existing: reconcile channel to ao_channel (operator_manage_channel),
#   wait AtLatestKnown + CSV Succeeded. Never create a second Subscription.

- name: Ensure AO operator Subscription for ao_channel
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Run AO EA operator ensure
      ansible.builtin.include_role:
        name: ao_ea_operator
