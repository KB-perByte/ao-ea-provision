---
# JT ea-ensure-secrets.
# Ensure app_ns and AO CR secretRef Secrets (orchestrator-pg-credentials,
# temporal-pg-credentials). Passwords come from AAP credentials and must
# match the DB roles from ea-ensure-db. Optional PG connect check may be
# skipped offline with secrets_verify_connect=false.

- name: Ensure early-access AO app-ns PG secrets
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Run AO EA secrets ensure
      ansible.builtin.include_role:
        name: ao_ea_secrets
