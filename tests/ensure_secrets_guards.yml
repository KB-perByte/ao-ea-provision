---
# Cluster-free ensure_secrets guard coverage. Does not call k8s.
# Positive: ansible-playbook tests/ensure_secrets_guards.yml
# Negative: ansible-playbook tests/ensure_secrets_guards.yml -e pg_orchestrator_password=''
#           ansible-playbook tests/ensure_secrets_guards.yml -e pg_temporal_password=''
#           ansible-playbook tests/ensure_secrets_guards.yml -e pg_service_host=wrong.svc

- name: Exercise secrets ensure guards without a cluster
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    pg_orchestrator_password: placeholder
    pg_temporal_password: placeholder
  tasks:
    - name: Run secrets ensure guards
      ansible.builtin.include_role:
        name: ao_ea_secrets
        tasks_from: guards

    - name: Require fail-closed secrets facts and derived pod
      ansible.builtin.assert:
        that:
          - pg_pod_name == pg_service_name ~ '-0'
          - secrets_ready is defined
          - not (secrets_ready | bool)
          - secrets_verified is defined
          - not (secrets_verified | bool)
          - pg_service_host == pg_service_name ~ '.' ~ db_ns ~ '.svc'
        fail_msg: >-
          ensure_secrets guards must set pg_pod_name={{ pg_service_name }}-0
          and leave secrets_ready/secrets_verified false until apply
          (and optional connect) succeed.
        success_msg: >-
          pg_pod_name={{ pg_pod_name }}; secrets_ready and secrets_verified
          are false until apply.
