---
# Local worker-env detection without a cluster. Does not call k8s.
# Positive: ansible-playbook tests/postconfig_record.yml

- name: Detect APP_SCRIPT_NODES_ENABLED when the operator set it
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    worker_query:
      resources:
        - spec:
            template:
              spec:
                containers:
                  - name: worker
                    env:
                      - name: APP_CACHE_HOST
                        value: redis
                      - name: APP_SCRIPT_NODES_ENABLED
                        value: "true"
  tasks:
    - name: Record worker script-nodes env from mock
      ansible.builtin.include_role:
        name: ao_ea_postconfig
        tasks_from: record_worker_env

    - name: Require detection of operator-managed env
      ansible.builtin.assert:
        that:
          - worker_exists | bool
          - worker_script_nodes_enabled | bool
          - worker_script_nodes_value | trim | lower == 'true'
        fail_msg: >-
          record_worker_env must detect APP_SCRIPT_NODES_ENABLED=true on
          the worker container env (operator-managed, not a Deployment patch).
        success_msg: >-
          Detected APP_SCRIPT_NODES_ENABLED={{ worker_script_nodes_value }}
          on {{ ao_name }}-worker.

- name: Do not treat a worker without the env as enabled
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    worker_query:
      resources:
        - spec:
            template:
              spec:
                containers:
                  - name: worker
                    env:
                      - name: APP_CACHE_HOST
                        value: redis
  tasks:
    - name: Record worker script-nodes env from mock without the flag
      ansible.builtin.include_role:
        name: ao_ea_postconfig
        tasks_from: record_worker_env

    - name: Require worker_script_nodes_enabled false
      ansible.builtin.assert:
        that:
          - worker_exists | bool
          - not (worker_script_nodes_enabled | bool)
          - worker_script_nodes_value | length == 0
        fail_msg: >-
          Missing APP_SCRIPT_NODES_ENABLED must leave
          worker_script_nodes_enabled false (EP not enabling the env).
        success_msg: >-
          worker_script_nodes_enabled=false when the operator has not
          set the env.
