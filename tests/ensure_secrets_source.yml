---
# Static contract: ensure_secrets must create AO CR secretRef Secrets in
# app_ns with keys database/username/password, consume AAP passwords, and
# never hardcode real secrets. Optional connect check is skippable.

- name: Assert ensure_secrets sources match the AO CR secretRef schema
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    secrets_sources:
      - "{{ playbook_dir }}/../playbooks/ensure_secrets.yml"
      - "{{ playbook_dir }}/../roles/ao_ea_secrets/tasks/main.yml"
      - "{{ playbook_dir }}/../roles/ao_ea_secrets/tasks/guards.yml"
      - "{{ playbook_dir }}/../roles/ao_ea_secrets/defaults/main.yml"
      - "{{ playbook_dir }}/../roles/ao_ea_secrets/templates/orchestrator_pg_credentials.yml.j2"
      - "{{ playbook_dir }}/../roles/ao_ea_secrets/templates/temporal_pg_credentials.yml.j2"
      - "{{ playbook_dir }}/../roles/ao_ea_secrets/templates/verify_connect.sh.j2"
  tasks:
    - name: Load secrets source files
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop: "{{ secrets_sources }}"
      register: secrets_slurps

    - name: Combine secrets source text
      ansible.builtin.set_fact:
        secrets_text: "{{ secrets_slurps.results | map(attribute='content') | map('b64decode') | join('\n') }}"

    - name: Load Secret templates
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - "{{ playbook_dir }}/../roles/ao_ea_secrets/templates/orchestrator_pg_credentials.yml.j2"
        - "{{ playbook_dir }}/../roles/ao_ea_secrets/templates/temporal_pg_credentials.yml.j2"
      register: secret_template_slurps

    - name: Combine Secret template text
      ansible.builtin.set_fact:
        secret_templates_text: "{{ secret_template_slurps.results | map(attribute='content') | map('b64decode') | join('\n') }}"

    - name: Require AO CR secretRef names, keys, and AAP password vars
      ansible.builtin.assert:
        that:
          - "'orchestrator-pg-credentials' in secrets_text"
          - "'temporal-pg-credentials' in secrets_text"
          - "'vault_pg_orchestrator_password' in secrets_text"
          - "'vault_pg_temporal_password' in secrets_text"
          - "'secrets_verify_connect' in secrets_text"
          - "'secrets_ready' in secrets_text"
          - "'secrets_verified' in secrets_text"
          - "'password mismatch / DB reuse' in secrets_text"
          - "'Ensure the app namespace exists' in secrets_text"
        fail_msg: >-
          ensure_secrets must create orchestrator-pg-credentials and
          temporal-pg-credentials, consume vault_pg_* passwords, ensure
          app_ns, produce secrets_ready/secrets_verified, and fail auth
          errors with password mismatch / DB reuse.

    - name: Require Secret templates use AO CR keys in app_ns
      ansible.builtin.assert:
        that:
          - "'namespace:' in secret_templates_text"
          - "'app_ns' in secret_templates_text"
          - "'database:' in secret_templates_text"
          - "'username:' in secret_templates_text"
          - "'password:' in secret_templates_text"
          - "'pg_orchestrator_password' in secret_templates_text"
          - "'pg_temporal_password' in secret_templates_text"
          - "'db_ns' not in secret_templates_text"
        fail_msg: >-
          App-ns Secret templates must use keys database, username,
          password, live in app_ns, and take passwords from Ansible vars.

    - name: Forbid hardcoded secrets and deleting DB resources
      ansible.builtin.assert:
        that:
          - "'changeme' not in secrets_text"
          - "'password123' not in secrets_text"
          - "'REDACTED' not in secrets_text"
          - "'state: absent' not in secrets_text"
          - "'oc delete' not in secrets_text"
          - "'no_log: true' in secrets_text"
        fail_msg: >-
          ensure_secrets must not hardcode passwords, must no_log secret
          apply/connect, and must not delete cluster objects.
